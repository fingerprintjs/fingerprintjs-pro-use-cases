# Fail on critical advisories in runtime dependencies.
# Runs daily too, because new advisories appear without any code change.
# https://pnpm.io/cli/audit
name: Dependency audit
on:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # Reads pnpm-lock.yaml, no install needed
      - name: Audit runtime dependencies
        run: pnpm audit --prod --audit-level critical
